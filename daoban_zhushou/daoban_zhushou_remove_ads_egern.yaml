# 倒班助手去开屏广告 · Egern 模块

name: "倒班助手去开屏广告"
description: "拦截倒班助手开屏广告（adxvip / adworker 广告平台）"
author: "凡尘ᴹᴼᴿᵀᴬᴸ"

rules:
  # 2026-11-07 23:20 日志：s.adxvip.com:443、cdn.adxvip.com:443
  - domain_suffix:
      match: "adxvip.com"
      policy: REJECT
  # 2026-11-07 23:20 日志：sdk.ssp.adworker.top:443、monitor.ssp.adworker.top:443
  - domain_suffix:
      match: "adworker.top"
      policy: REJECT
  # 2026-11-07 23:30 日志：vista.divms.cn:443，开屏同时下行 17 KB；真机验证：加上这条后开屏没了
  - domain_suffix:
      match: "divms.cn"
      policy: REJECT
