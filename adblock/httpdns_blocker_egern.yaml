# HTTPDNS拦截器 · Egern 模块

name: "HTTPDNS拦截器"
description: "拦截常见 HTTPDNS 服务，让请求回落到常规 DNS；去广告模块的依赖，建议置于顶部。"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/Other_icon/120px/HTTPDNS.png"

rules:
  - domain_keyword:
      match: "httpdns"
      policy: "REJECT"
  - domain_keyword:
      match: "httpsdns"
      policy: "REJECT"
  - user_agent:
      match: "httpdns*"
      policy: "REJECT"
  - user_agent:
      match: "httpsdns*"
      policy: "REJECT"
  - user_agent:
      match: "Httpdns*"
      policy: "REJECT"
  - user_agent:
      match: "Httpsdns*"
      policy: "REJECT"
  - and:
      match:
        - url_regex:
            match: "^http://119\\.29\\.29\\.90/d\\?"
        - user_agent:
            match: "%E5%98%80%E5%97%92%E5%87%BA%E8%A1%8C*"
      policy: "DIRECT"
  - and:
      match:
        - url_regex:
            match: "^http://119\\.28\\.28\\.90/d\\?"
        - user_agent:
            match: "%E5%98%80%E5%97%92%E5%87%BA%E8%A1%8C*"
      policy: "DIRECT"
  - url_regex:
