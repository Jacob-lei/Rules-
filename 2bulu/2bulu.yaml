# 两步路户外助手去
name: "两步路户外助手去广告"
description: "移除开屏广告、弹窗广告，精简我的页面。"
author: "可莉"
homepage: "https://hub.kelee.one"
open_url: "https://apps.apple.com/app/id646277024"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/2bulu.png"

rules:
  - domain_suffix:
      match: "admobile.top"
      policy: REJECT
  - domain_suffix:
      match: "guangshiting.top"
      policy: REJECT
  - domain_suffix:
      match: "zhitouads.com"
      policy: REJECT
  - domain_suffix:
      match: "vipliangmei.com"
      policy: REJECT
  - domain_suffix:
      match: "roiplusad.com"
      policy: REJECT
  - domain_suffix:
      match: "adtrack.qianwen.com"
      policy: REJECT
  - domain_suffix:
      match: "medproad.com"
      policy: REJECT
  - domain_suffix:
      match: "funlinkads.com"
      policy: REJECT
  - domain_suffix:
      match: "buluken.com"
      policy: REJECT

url_rewrites:
  - match: '(?i)^https://helper\.2bulu\.com/(getAppEntranceConfig|search/searchHotKeyList|promote/getAppUserModule|proSpecial/allData)\?'
    location: "http://reject-dict/"
  - match: '(?i)^https://helper\.2bulu\.com/(getSplash|getPopInfo|saveSplashFrequencyStatistics|promote/list|greenPea/queryTasks|outing/reqFoundNewList|outing/reqIndex)'
    location: "http://reject-dict/"
  - match: '(?i)^https://helper\.2bulu\.com/(v9/)?advert/.*\?'
    location: "http://reject-dict/"
  - match: '(?i)^https://helper\.2bulu\.com/adConfig/.*\?'
    location: "http://reject-dict/"
  - match: '(?i)^https://helper\.2bulu\.com/getFreeAdDuration\?'
    location: "http://reject-dict/"

mitm:
  hostnames:
    - "helper.2bulu.com"
