# 京东比价 · Egern 模块（慢慢买数据源）
# 使用步骤：
#   1. 导入这个模块。
#   2. 装“慢慢买”App，打开它，进“我的”页面，收到“参数已保存”通知才算抓到参数。
#      参数只存在本机，查询时只发给慢慢买接口，不含账号密码。
#   3. 再打开京东商品详情页（没出表就点一下商品“详情”），顶部会出历史价格表。

name: "京东比价（慢慢买）"
description: "京东商品详情页显示慢慢买历史价格：当前到手价、历史最低、30/60/90/180/365天最低、618、双11、双12。首次使用需打开慢慢买 App → 我的，捕获参数。"
author: "wf021325（原脚本）"
homepage: "https://github.com/wf021325/qx/blob/main/js/jd_price.js"
open_url: "https://item.jd.com/"

scriptings:
  - http_request:
      name: "捕获慢慢买参数"
      match: '(?i)^https?://apapia-sqk-weblogic\.manmanbuy\.com/baoliao/center/menu(?:\?|$)'
      script_url: "https://raw.githubusercontent.com/Jacob-lei/Rules-/refs/heads/main/jd_bijia/jd_bijia_mmb_egern.js"
      body_required: true
      timeout: 10
      update_interval: 86400
  - http_response:
      name: "京东历史比价"
      match: '(?i)^https?://in\.m\.jd\.com/product/graphext/\d+\.html(?:\?|$)'
      script_url: "https://raw.githubusercontent.com/Jacob-lei/Rules-/refs/heads/main/jd_bijia/jd_bijia_mmb_egern.js"
      body_required: true
      timeout: 30
      update_interval: 86400

mitm:
  hostnames:
    - "in.m.jd.com"
    - "apapia-sqk-weblogic.manmanbuy.com"
