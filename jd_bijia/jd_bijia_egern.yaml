# 京东比价 · Egern 模块（慢慢买数据源）
# 为什么换数据源：原来用的 w.so168.top 已经挂了，2026-11-06 实测它对任何商品
# 都只返回 HTTP 200 空内容，没法再用。这一版改用慢慢买的历史价格接口。
# 流程照 wf021325 的 jd_price.js（2025-07-10），改成 Egern 原生写法，
# 见配套文件 jd_bijia_mmb_egern.js。
#
# 使用步骤：
#   1. 关掉旧的“京东比价”和“京东比价（调试版）”模块，再导入这个模块。
#   2. 装“慢慢买”App，打开它，进“我的”页面，收到“参数已保存”通知才算抓到参数。
#      参数只存在本机，查询时只发给慢慢买接口，不含账号密码。
#   3. 再打开京东商品详情页（没出表就点一下商品“详情”），顶部会出历史价格表。
#   4. 参数失效时（表里提示）重做第 2 步。
#
# 注意：
#   1. 需要 MITM in.m.jd.com 和 apapia-sqk-weblogic.manmanbuy.com，证书要信任。
#   2. 下面 script_url 是用户自己 GitHub 仓库里的永久地址
#      （Jacob-lei/Rules-，jd_bijia_mmb_egern.js），不会过期；
#      以后改脚本直接更新 GitHub 上的文件就行，不用换 YAML。
#   3. 真机已确认可用（2026-11-06）。若表里提示参数失效，重进慢慢买“我的”抓一次参数。
name: "京东比价（慢慢买）"
description: "京东商品详情页显示慢慢买历史价格：当前到手价、历史最低、30/60/90/180/365天最低、618、双11、双12。首次使用需打开慢慢买 App → 我的，捕获参数。"
author: "wf021325（原脚本）"
homepage: "https://github.com/wf021325/qx/blob/main/js/jd_price.js"
open_url: "https://item.jd.com/"

scriptings:
  - http_request:
      name: "捕获慢慢买参数"
      match: '(?i)^https?://apapia-sqk-weblogic\.manmanbuy\.com/baoliao/center/menu(?:\?|$)'
      script_url: "https://raw.githubusercontent.com/Jacob-lei/Rules-/refs/heads/main/jd_bijia/jd_bijia_mmb_egern.js"
      body_required: true
      timeout: 10
      update_interval: 86400
  - http_response:
      name: "京东历史比价"
      match: '(?i)^https?://in\.m\.jd\.com/product/graphext/\d+\.html(?:\?|$)'
      script_url: "https://raw.githubusercontent.com/Jacob-lei/Rules-/refs/heads/main/jd_bijia/jd_bijia_mmb_egern.js"
      body_required: true
      timeout: 30
      update_interval: 86400

mitm:
  hostnames:
    - "in.m.jd.com"
    - "apapia-sqk-weblogic.manmanbuy.com"
